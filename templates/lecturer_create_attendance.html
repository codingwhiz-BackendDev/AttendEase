{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Create Attendance Session</h1>
            <p class="text-gray-600">Set up a new attendance session with geofencing for your course</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8 card-hover">
            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <!-- Course Selection -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-book mr-2 text-indigo-600"></i>Course Title
                    </label>
                    <select name="course" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all bg-gray-50">
                        <option value="">Select a course</option>
                        {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.course_title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Lecture Hall -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-building mr-2 text-indigo-600"></i>Lecture Hall
                    </label>
                    <input type="text" name="lecture_hall" placeholder="Enter lecture hall" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all bg-gray-50">
                </div>

                <!-- Location Section -->
                <div class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl p-6 border border-indigo-100">
                    <label class="block text-sm font-semibold text-gray-700 mb-3">
                        <i class="fas fa-map-marker-alt mr-2 text-indigo-600"></i>Lecture Location
                    </label>
                    <div class="grid grid-cols-2 gap-4 mb-3">
                        <div>
                            <input type="text" id="latitude" name="latitude" placeholder="Latitude" readonly class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-gray-600">
                        </div>
                        <div>
                            <input type="text" id="longitude" name="longitude" placeholder="Longitude" readonly class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-gray-600">
                        </div>
                    </div>
                    <div id="location-status" class="flex items-center text-sm">
                        <i class="fas fa-spinner fa-spin mr-2 text-indigo-600"></i>
                        <span class="text-gray-600">Fetching location...</span>
                    </div>
                </div>

                <!-- Time Selection -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-clock mr-2 text-indigo-600"></i>Start Time
                        </label>
                        <input type="datetime-local" name="start_time" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-clock mr-2 text-indigo-600"></i>End Time
                        </label>
                        <input type="datetime-local" name="end_time" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all bg-gray-50">
                    </div>
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-sticky-note mr-2 text-indigo-600"></i>Additional Notes
                    </label>
                    <textarea name="notes" placeholder="Enter any additional notes" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all bg-gray-50 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-4 px-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl hover:from-indigo-700 hover:to-purple-700 focus:ring-4 focus:ring-indigo-300 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    <i class="fas fa-plus-circle mr-2"></i>Create Attendance Session
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    document.getElementById("latitude").value = position.coords.latitude;
                    document.getElementById("longitude").value = position.coords.longitude;
                    document.getElementById("location-status").innerHTML = '<i class="fas fa-check-circle mr-2 text-green-600"></i><span class="text-green-600">Location fetched successfully!</span>';
                },
                function (error) {
                    document.getElementById("location-status").innerHTML = '<i class="fas fa-exclamation-circle mr-2 text-red-600"></i><span class="text-red-600">Failed to fetch location. Please enable location access.</span>';
                }
            );
        } else {
            document.getElementById("location-status").innerHTML = '<i class="fas fa-exclamation-circle mr-2 text-red-600"></i><span class="text-red-600">Geolocation is not supported by your browser.</span>';
        }
    }
    getLocation();
</script>
{% endblock content %}
