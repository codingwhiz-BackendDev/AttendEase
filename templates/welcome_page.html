{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to AttendEase</title>
    <link rel="stylesheet" href="{% static 'welcome_page.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Logo (Checkmark) -->
    <div class="logo">
        <i class="fas fa-check-circle"></i>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <div class="overlay"></div>
        <div class="content">
            <h1>Welcome to <span>AttendEase</span></h1>
            <p>Your Smart Attendance Companion</p>
            <div class="buttons">
                <a href="/student/login/" class="btn btn-student">
                    <i class="fas fa-user-graduate"></i> Sign Up as Student
                </a>
                <a href="/lecturer/login/" class="btn btn-lecturer">
                    <i class="fas fa-chalkboard-teacher"></i> Sign Up as Lecturer
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2025 AttendEase. All rights reserved.
    </footer>
</body>
</html>
